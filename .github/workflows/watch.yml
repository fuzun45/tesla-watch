name: Tesla Model Y takip

on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub en sık 5 dk'ya izin veriyor (yoğunlukta birkaç dk gecikebilir)
  workflow_dispatch:
    inputs:
      mode:
        description: "check | test | list"
        default: "check"

permissions:
  contents: write

concurrency:
  group: tesla-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kontrol
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'check' }}"
          case "$MODE" in
            test) python tesla_watch.py --test ;;
            list) python tesla_watch.py --list ;;
            *)    python tesla_watch.py ;;
          esac

      - name: Durumu kaydet
        if: always()
        run: |
          if [ -n "$(git status --porcelain tesla_seen.json)" ]; then
            git config user.name  "tesla-watch-bot"
            git config user.email "tesla-watch-bot@users.noreply.github.com"
            git add tesla_seen.json
            git commit -m "durum güncellendi"
            git pull --rebase -q || true
            git push
          fi
