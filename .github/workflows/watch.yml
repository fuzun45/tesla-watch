name: Tesla Model Y takip

on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub en sık 5 dk'ya izin veriyor (yoğunlukta birkaç dk gecikebilir)
  push:
    paths: ["trigger.txt"]     # trigger.txt içine check / test / list yazıp push'la -> çıktı last_run.log'a yazılır
  workflow_dispatch:
    inputs:
      mode:
        description: "check | test | list"
        default: "check"

permissions:
  contents: write

concurrency:
  group: tesla-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kontrol
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'check' }}"
          LOG=/tmp/run.log
          if [ "${{ github.event_name }}" = "push" ]; then MODE="$(head -1 trigger.txt | tr -d '[:space:]')"; LOG=last_run.log; fi
          echo "mode=$MODE  $(date -u +%FT%TZ)" | tee "$LOG"
          set -o pipefail
          case "$MODE" in
            test) python tesla_watch.py --test ;;
            list) python tesla_watch.py --list ;;
            *)    python tesla_watch.py ;;
          esac 2>&1 | tee -a "$LOG"

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name  "tesla-watch-bot"
          git config user.email "tesla-watch-bot@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "push" ]; then git add last_run.log; fi
          if [ -n "$(git status --porcelain tesla_seen.json)" ]; then git add tesla_seen.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "durum güncellendi"
            git pull --rebase -q || true
            git push
          fi
